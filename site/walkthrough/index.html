<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkthrough for Agnost</title>
<meta name="description" content="90-second walkthrough: Pipecat tool calls Agnost can't recover, and the 80-line fix.">
<meta property="og:title" content="Walkthrough: 5 of 10 Pipecat tool calls, and the fix">
<meta property="og:image" content="https://agnost-adk-guide-check.vercel.app/walkthrough/poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400..600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C0C0C; --ink-2:#3A3A3A; --muted:#6B6B6B; --line:#E4E4E4; --line-2:#D2D2D2;
  --canvas:#FFFFFF; --wash:#FAFAF9;
  --violet:#6D3DF5; --violet-ink:#4B22C9; --violet-soft:#EFEAFE; --violet-mid:#CDBDFB;
  --red:#C2304A; --green:#1F8A5B;
  --serif:"Instrument Serif",Georgia,serif; --sans:"Instrument Sans",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 16px/1.6 var(--sans);overflow-x:hidden}
a{color:inherit}
code{font:400 .9em var(--mono);background:var(--violet-soft);color:var(--violet-ink);padding:1px 5px;border-radius:4px}
.frame{max-width:1240px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
.bar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--line);font-size:14px}
.bar b{font-weight:600}
.bar span{color:var(--muted)}
.bar nav{display:flex;gap:22px}
.bar nav a{text-decoration:none;color:var(--ink-2)}
.bar nav a:hover{color:var(--violet-ink)}

.hero{padding:48px 32px 28px;text-align:center}
.from{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:16px}
.from i{width:8px;height:8px;border-radius:2px;background:var(--violet);transform:rotate(45deg)}
h1{font:400 clamp(2.4rem,1.5rem + 3vw,4rem)/1.02 var(--serif);letter-spacing:-.01em;margin:0 auto;max-width:22ch;text-wrap:balance}
h1 em{font-style:italic;color:var(--violet-ink)}
.lede{max-width:62ch;margin:16px auto 0;font-size:18px;color:var(--ink-2);text-wrap:pretty}
.ctas{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;font:500 14px var(--sans);text-decoration:none;transition:transform .14s var(--ease-out),background .2s}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:#262626}
.btn.dash{border:1px dashed var(--ink-2);color:var(--ink)}
.btn.dash:hover{border-style:solid}
.btn:focus-visible,.seg button:focus-visible,a:focus-visible{outline:2px solid var(--violet);outline-offset:3px}

.viewer{margin:40px 32px 0;border:1px solid var(--line-2);border-radius:14px;background:var(--canvas);box-shadow:0 1px 0 var(--line),0 30px 70px -40px rgba(76,34,201,.35);overflow:hidden;text-align:left}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--wash);flex-wrap:wrap}
.vtitle{font:500 13px var(--mono);color:var(--ink-2)}
.vtitle b{color:var(--ink);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:3px;background:#fff}
.seg button{border:0;background:transparent;font:500 13px var(--sans);color:var(--ink-2);padding:7px 14px;border-radius:6px;cursor:pointer;transition:background .2s var(--ease-out),color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.vbody{display:grid;grid-template-columns:minmax(0,1fr) 240px}
.rows{padding:10px 0}
.row{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:center;gap:18px;padding:11px 18px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.rl{font-size:14px;line-height:1.35}
.rl small{display:block;color:var(--muted);font:400 12px var(--mono);margin-top:3px}
.strip{display:flex;gap:6px;align-items:stretch;min-width:0}
.blk{height:34px;border-radius:5px;display:flex;align-items:center;padding:0 9px;font:500 11.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.u{background:#F1F1F1;color:var(--ink-2);flex:0 0 74px}
.l{background:#E9E5F8;color:#5A4A93;flex:0 0 54px}
.t{flex:1 1 0;position:relative;transition:background .45s var(--ease-out),color .45s,border-color .45s}
.t.ok{background:var(--violet);color:#fff}
.t.lost{background:transparent;border:1.5px dashed #E0A3B0;color:var(--red)}
.fix .t.lost{background:var(--violet-ink);border-color:transparent;color:#fff;box-shadow:0 0 0 3px var(--violet-mid)}
.t .tag{position:absolute;right:7px;top:50%;font:500 10px var(--sans);background:#fff;color:var(--violet-ink);padding:2px 7px;border-radius:99px;opacity:0;transform:translate(4px,-50%);transition:opacity .35s var(--ease-out) .15s,transform .35s var(--ease-out) .15s}
.fix .t.lost .tag{opacity:1;transform:translate(0,-50%)}
.t .a,.t .b{position:absolute;left:9px;right:9px;overflow:hidden;text-overflow:ellipsis;transition:opacity .35s var(--ease-out),transform .35s var(--ease-out)}
.t .b{opacity:0;transform:translateY(6px)}
.fix .t.lost .a{opacity:0;transform:translateY(-6px)}
.fix .t.lost .b{opacity:1;transform:none}
.e{flex:0 0 92px;background:#F6F6F6;color:var(--muted)}
.e.end{background:#fff;border:1px solid var(--line-2)}
.side{border-left:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:18px;background:var(--wash)}
.count{font:400 64px/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.count .n{color:var(--red);transition:color .4s}
.fix .count .n{color:var(--violet-ink)}
.side p{margin:0;font-size:14px;color:var(--ink-2)}
.side .key{display:grid;gap:8px;font-size:13px;color:var(--ink-2)}
.side .key span{display:flex;align-items:center;gap:8px}
.side .key i{width:22px;height:12px;border-radius:3px;display:inline-block}
.k1{background:var(--violet)}.k2{border:1.5px dashed #E0A3B0}.k3{background:var(--violet-ink);box-shadow:0 0 0 2px var(--violet-mid)}
.side .key .fx{display:none}.fix .side .key .fx{display:flex}
.side a{font-size:14px;color:var(--violet-ink);font-weight:500}
.cap{padding:12px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);background:#fff}

section{padding:96px 32px 0}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:start}
.num{font:italic 400 17px var(--serif);color:var(--violet-ink)}
h2{font:400 clamp(2rem,1.5rem + 1.8vw,3rem)/1.05 var(--serif);letter-spacing:-.01em;margin:6px 0 14px;text-wrap:balance}
.split p{color:var(--ink-2);margin:0 0 14px;max-width:46ch}
.more{display:inline-flex;gap:6px;color:var(--violet-ink);font-weight:500;text-decoration:none;border-bottom:1px solid var(--violet-mid);padding-bottom:2px}
.more:hover{border-color:var(--violet-ink)}
.ci{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;font:400 13.5px/1.5 var(--mono)}
.ci header{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--ink);color:#EDEDED;font-size:12.5px}
.ci header b{color:#7BE0A9;font-weight:500;white-space:nowrap}
.ci ol{list-style:none;margin:0;padding:6px 0}
.ci li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:8px 16px;border-bottom:1px solid #F0F0F0}
.ci li:last-child{border-bottom:0}
.ci li::before{content:"✓";color:var(--green);font-weight:500}
.ci li span:last-child{color:var(--muted)}
.gaps{list-style:none;margin:0;padding:0;counter-reset:g}
.gaps li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;padding:18px 0;border-top:1px solid var(--line)}
.gaps li:last-child{border-bottom:1px solid var(--line)}
.gaps li::before{counter-increment:g;content:counter(g,decimal-leading-zero);font:400 28px/1 var(--serif);color:var(--violet-ink)}
.gaps b{font-weight:600}
.gaps p{margin:4px 0 0;color:var(--ink-2);font-size:15px;max-width:none}
.note{max-width:720px;margin:0 auto;text-align:left}
.note p{font:400 clamp(1.35rem,1.1rem + .9vw,1.75rem)/1.4 var(--serif);margin:0 0 18px;color:var(--ink)}
.note p.small{font:400 15px/1.6 var(--sans);color:var(--ink-2)}
.sig{font:italic 400 30px var(--serif);color:var(--violet-ink);margin-top:6px}
footer{margin-top:96px;padding:22px 32px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
footer a{color:var(--ink-2)}

.rise>*{opacity:0;transform:translateY(18px);animation:rise .9s var(--ease-expo) forwards}
.rise>*:nth-child(2){animation-delay:80ms}.rise>*:nth-child(3){animation-delay:160ms}.rise>*:nth-child(4){animation-delay:240ms}
.viewer{opacity:0;transform:translateY(28px) scale(.985);animation:rise 1s var(--ease-expo) .3s forwards}
@keyframes rise{to{opacity:1;transform:none}}

@media (max-width:980px){
  .vbody{grid-template-columns:1fr}
  .side{border-left:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;order:-1;gap:12px 28px}
  .count{font-size:52px}
  .split{grid-template-columns:1fr;gap:24px}
}
@media (max-width:640px){
  .bar{padding:14px 16px}.bar span{display:none}.bar nav{gap:14px;font-size:13px}
  .hero{padding:48px 16px 8px}
  .viewer{margin:36px 12px 0}
  .row{grid-template-columns:1fr;gap:8px;padding:12px 14px}
  .hide-s{display:none}.t .tag{display:none}.side .key{display:none}.side>a{display:none}.u{flex-basis:46px}.l{flex-basis:36px}.e{flex-basis:86px}
  .blk{font-size:10.5px;padding:0 7px}
  .t .a,.t .b{left:7px;right:7px}
  .vhead{padding:12px 14px}
  section{padding:72px 16px 0}
  footer{padding:20px 16px}
  .ci li{grid-template-columns:18px minmax(0,1fr)}
  .ci li span:last-child{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}

.player{margin:36px auto 0;max-width:1100px;border-radius:14px;overflow:hidden;border:1px solid var(--line-2);box-shadow:0 30px 70px -40px rgba(76,34,201,.35);background:#000}
.player video{display:block;width:100%;height:auto;aspect-ratio:16/9}
.below{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
</style>
</head>
<body>
<div class="frame">
  <div class="bar">
    <div><b>Nitesh Kumar Yadav</b> <span>for the Growth Lead role at Agnost AI</span></div>
    <nav aria-label="Page"><a href="/start">Overview</a><a href="/pipecat-tool-calls">Pipecat test</a></nav>
  </div>
  <div class="hero" style="padding-bottom:64px">
    <div class="rise">
      <div class="from"><i></i>About 90 seconds, sound on</div>
      <h1 style="max-width:22ch">What I found in Agnost's Pipecat setup, and the fix</h1>
    </div>
    <div class="player">
      <video controls playsinline preload="metadata" poster="/walkthrough/poster.jpg">
        <source src="/walkthrough/walkthrough.mp4" type="video/mp4">
      </video>
    </div>
    <div class="below">
      <a class="btn solid" href="/start">See everything in one place</a>
      <a class="btn dash" href="/pipecat-tool-calls">The test and the code</a>
    </div>
  </div>
</div>
</body>
</html>
